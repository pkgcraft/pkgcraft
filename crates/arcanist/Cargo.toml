[package]
name = "arcanist"
version = "0.0.5"
description = "package-building daemon leveraging pkgcraft"
homepage = "https://github.com/pkgcraft/pkgcraft/tree/main/crates/arcanist"
repository = "https://github.com/pkgcraft/pkgcraft/tree/main/crates/arcanist"
readme = "README.md"
license = "MIT"
autotests = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
clap = { version = "4.6.2", default-features = false, features = ["std", "suggestions"] }
config = { version = "0.15.25", default-features = false, features = ["toml"] }
futures = "0.3.33"
hyper-util = "0.1.20"
pkgcraft = { path = "../pkgcraft", version = "0.0.31" }
prost = "0.14.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tonic = { version = "0.14.6", features = ["tls-ring", "gzip"] }
tonic-prost = "0.14.6"
url = "2.5.8"

# pakt specific deps
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tower = "0.5.3"

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
assert_cmd = "2.2.2"
regex = "1.13.1"
tempfile = "3.27.0"

[lib]
name = "arcanist"
path = "src/lib/lib.rs"

[[bin]]
bench = false
path = "src/server/main.rs"
name = "arcanist"

[[bin]]
bench = false
path = "src/cli/main.rs"
name = "pakt"

[[test]]
name = "integration"
path = "tests/lib.rs"
