[package]
name = "pkgcraft"
version = "0.0.31"
description = "library of Gentoo functionality"
homepage = "https://github.com/pkgcraft/pkgcraft/tree/main/crates/pkgcraft"
repository = "https://github.com/pkgcraft/pkgcraft/tree/main/crates/pkgcraft"
readme = "README.md"
license = "MIT"
autotests = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "pkgcraft"

[features]
default = ["git"]
# git repo support
git = ["dep:gix"]
# test support for external crates
test = ["dep:ctor", "dep:pretty_assertions", "scallop/test"]

[dependencies]
# temporarily use rc version for =digest-0.11.* support
blake2 = "0.11.0-rc.6"
blake3 = { version = "1.8.7", features = ["traits-preview"] }
cached = "2.0.2"
camino = { version = "1.2.5", features = ["serde1"] }
camino-tempfile = "1.4.1"
chic = "1.2.2"
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5.16"
dashmap = "6.2.1"
digest = "0.11.3"
enum-as-inner = "0.7.0"
filetime = "0.2.29"
futures = "0.3.34"
gix = { version = "0.86.0", default-features = false, features = ["blocking-http-transport-reqwest-rust-tls", "worktree-mutation", "sha1", "sha256"], optional = true }
glob = "0.3.4"
hex = "0.4.3"
indexmap = { version = "2.14.0", features = ["rayon", "serde"] }
indicatif = "0.18.6"
indoc = "2.0.7"
ipc-channel = "0.22.0"
is_executable = "1.0.6"
itertools = "0.15.0"
libc = "0.2.189"
md-5 = "0.11.0"
nix = { version = "0.31.3", features = ["process", "user", "signal"] }
num_cpus = "1.17.0"
ordermap = { version = "1.2.0", features = ["rayon", "serde"] }
peg = "0.8.6"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["hickory-dns", "socks", "stream"] }
roxmltree = "0.21.1"
rust-ini = "0.21.3"
scallop = { path = "../scallop", version = "0.0.30" }
serde = { version = "1.0.229", features = ["derive"] }
serde_with = { version = "3.22.0", default-features = false, features = ["macros"] }
sha2 = "0.11.0"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tree-sitter = "0.26.12"
tree-sitter-bash = "0.25.1"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.1", features = ["v4", "v7", "fast-rng"] }
walkdir = "2.5.0"

# exported test support deps
ctor = { version = "1.0.13", optional = true }
pretty_assertions = { version = "1.4.1", optional = true }

[dev-dependencies]
criterion = "0.8"
ctor = "1.0.13"
scallop = { path = "../scallop", version = "0.0.30", features = ["test"] }
serde_json = "1.0.151"
tracing-test = "0.2.6"
pretty_assertions = { version = "1.4.1"}

[[bench]]
name = "bench"
harness = false
